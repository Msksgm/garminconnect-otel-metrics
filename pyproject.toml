[project]
name = "garminconnect-otel-metrics"
version = "0.1.0"
description = "Garmin Connect のアクティビティを OpenTelemetry メトリクスとして OTLP で送信する"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.15.0",
    "garminconnect>=0.3.6",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# tests/ に __init__.py を置かない構成では pytest が tests/ しか sys.path に入れないため、
# リポジトリ直下を明示して import activity を解決できるようにする
pythonpath = ["."]
testpaths = ["tests"]
