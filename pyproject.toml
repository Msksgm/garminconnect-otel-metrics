[project]
name = "garminconnect-otel-metrics"
version = "0.1.0"
description = "Garmin Connect のアクティビティを OpenTelemetry メトリクスとして OTLP で送信する"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.15.0",
    "garminconnect>=0.3.6",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
]
